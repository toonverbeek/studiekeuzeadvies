<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" role="img" aria-label="StudieKeuzeAdvies">
  <title>StudieKeuzeAdvies</title>
  <!-- The client's mark: three steps rising to the right, ending in a coral
       dot. A wordmark turns to mud at 16 pixels, the staircase does not, and
       it is the one shape this brand owns.
       The tile is ink and not paper, because a browser tab is dark half the
       time and a paper tile disappears into a light one. The path is
       violet-light (#8f75ff), which is the colour the client uses for the mark
       on an ink surface. The corners stay square: every platform masks the
       shape it wants, and a rounded corner would be masked twice.
       Regenerate the raster marks from this file with docs/art/build-marks.mjs. -->
  <rect width="44" height="44" fill="#1e1b4b"/>
  <path d="M6 36 L16 36 L16 26 L26 26 L26 16 L36 16 L36 8" stroke="#8f75ff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="36" cy="8" r="4.5" fill="#ff6b4a"/>
</svg>
